# yaml-language-server: $schema=../schemas/v0/theme.schema.json
# Paper theme - warm, readable, for narrative documentation
name: "Paper"
colors:
  light:
    background: "#fffbf5"
    surface: "#f9f5ef"
    text: "#3d3d3d"
    textMuted: "#6b6b6b"
    heading: "#1a1a1a"
    primary: "#b35900"
    primaryHover: "#994d00"
    accent: "#c44536"
    border: "#e6dfd6"
  dark:
    background: "#1a1816"
    surface: "#252220"
    text: "#d9d5d0"
    textMuted: "#9c9590"
    heading: "#f5f2ed"
    primary: "#e6a35c"
    primaryHover: "#f0b673"
    accent: "#e07b6b"
    border: "#3d3835"
code:
  light: "solarized-light"
  dark: "nord"
typography:
  body: "readable"
  headings: "system"
  code: "mono"
  baseSize: "17px"
  scale: "1.2"
