# Release Artifact Generation
#
# Triggered when a semver tag (v*.*.*) is pushed.
# Validates VERSION, runs quality gates, builds cross-platform binaries,
# packages npm tarball, generates checksums, and creates a DRAFT GitHub release.
#
# Cross-compilation note:
#   Bun's --compile --target flag can cross-compile from a single Linux runner
#   to linux-x64, linux-arm64, darwin-arm64, and windows-x64. However, Bun does
#   NOT support cross-compiling to windows-arm64 (bun-windows-aarch64). That
#   target must be built natively. Use release-windows-arm64.yml to add it to
#   an existing draft release when needed.
#
# After CI creates the draft, the maintainer runs the local signing workflow:
#   1. (Optional) Run release-windows-arm64.yml to add the win-arm64 binary
#   2. make release-download KITFLY_RELEASE_TAG=vX.Y.Z
#   3. make release-checksums
#   4. make release-verify-checksums
#   5. make release-sign KITFLY_RELEASE_TAG=vX.Y.Z
#   6. make release-export-keys
#   7. make release-upload KITFLY_RELEASE_TAG=vX.Y.Z
name: Release
"on":
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
permissions:
  contents: write
jobs:
  release:
    name: Build & Draft Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Verify tag matches VERSION
        run: |
          VERSION=$(cat VERSION)
          TAG=${GITHUB_REF_NAME#v}
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match VERSION file ($VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_ENV"
          echo "Tag matches VERSION: $VERSION"
      - name: Build prep (Bun + deps + embedded assets)
        uses: ./.github/actions/build-prep
      - name: Quality gates
        run: |
          bun run format:check
          bun run lint:ci
          bun run typecheck
          bun run test
      - name: Build cross-platform binaries
        run: bun run build:all
      - name: Package npm tarball
        run: |
          npm pack --pack-destination dist/release/
      - name: Generate checksums
        run: ./scripts/generate-checksums.sh dist/release kitfly
      - name: List release artifacts
        run: ls -la dist/release/
      - name: Create draft GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${version}"

          echo "Creating draft release for ${TAG}..."

          # shellcheck disable=SC2086
          gh release create "${TAG}" \
            --title "${TAG}" \
            --draft \
            --verify-tag \
            --notes "## kitfly ${TAG}

          ### Download

          | Platform | Binary |
          |----------|--------|
          | Linux x64 | \`kitfly-linux-amd64\` |
          | Linux arm64 | \`kitfly-linux-arm64\` |
          | macOS arm64 | \`kitfly-darwin-arm64\` |
          | Windows x64 | \`kitfly-windows-amd64.exe\` |
          | npm | \`kitfly-${version}.tgz\` |

          ### Install from npm

          \`\`\`bash
          bun install -g kitfly
          # or
          npm install -g kitfly
          \`\`\`

          ### Verification

          Once signed artifacts are available:
          \`\`\`bash
          # Verify checksum signature
          minisign -Vm SHA256SUMS -p kitfly-minisign.pub

          # Verify package checksum
          shasum -a 256 -c SHA256SUMS
          \`\`\`" \
            dist/release/*

          echo "Draft release created: https://github.com/${{ github.repository }}/releases/tag/${TAG}"
